        text: You'll know what we're doing and why, before we do it.
      - icon: Clock
        title: We turn up on time
        text: If something changes, we call you, not the other way round.
      - icon: Sparkles
        title: We leave it clean
        text: Dust sheets down while we work, and everything tidied away after.

